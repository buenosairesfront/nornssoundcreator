<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norns Sound Creator · U-MA</title>
<meta name="description" content="Diseño de sonidos para norns y SuperCollider en el navegador. Exporta Lua, .sc, .scd, Faust (VST/AU) y web app. ES · EN · DE · 中文 · 日本語 · हिन्दी">
<meta name="theme-color" content="#121314">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#C8C9C5; --paper:#F0EFEA; --paperFg:#141414; --paperLine:rgba(20,20,20,.22); --paperMute:#5E5E5A;
  --ink:#121314; --mag:#D12F7D; --cya:#2A9EBF; --yel:#E1C43B;
  --disp:"Barlow Condensed","Noto Sans JP","Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Noto Sans JP","Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans Devanagari",monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--paperFg); font:14px/1.45 var(--mono); -webkit-tap-highlight-color:transparent; overflow-x:hidden}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--cya); outline-offset:2px}
.app{max-width:780px; margin:0 auto; padding:0 10px}

/* panel themes (spec-sheet strips) */
.p-paper{--pb:var(--paper); --pf:var(--paperFg); --pl:var(--paperLine); --pm:var(--paperMute); --pa:var(--mag); --pat:#fff}
.p-ink{--pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.p-mag{--pb:var(--mag); --pf:#101010; --pl:rgba(0,0,0,.32); --pm:rgba(0,0,0,.68); --pa:#101010; --pat:var(--mag)}
.p-yel{--pb:var(--yel); --pf:#101010; --pl:rgba(0,0,0,.3); --pm:rgba(0,0,0,.66); --pa:#101010; --pat:var(--yel)}
.panel{background:var(--pb); color:var(--pf); border:1.5px solid var(--pf); outline:1.5px solid var(--pb); position:relative}
.panel::after{content:""; position:absolute; inset:5px; border:1px solid var(--pl); pointer-events:none}
.panel>.in{padding:14px 16px 18px; position:relative; z-index:1}

/* top */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding:8px 0}
.bar{display:flex; align-items:center; gap:6px; position:relative}
.iconbtn:disabled{opacity:.35}
.logo{height:36px; width:auto; flex:none; display:block}
.title{flex:1; min-width:0}
.title b{display:block; font:800 clamp(16px,5vw,22px)/0.95 var(--disp); text-transform:uppercase; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title small{display:flex; gap:10px; font:500 10.5px/1.3 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; white-space:nowrap; overflow:hidden}
.iconbtn{width:36px; height:36px; border:1.5px solid var(--paperFg); background:var(--paper); display:grid; place-items:center; flex:none; font-size:17px}
.scopecard{margin-top:8px}
.scopecard>.in{padding:10px 12px 10px}
.meta{display:flex; justify-content:space-between; gap:8px; font:500 10px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm)}
#scope{display:block; width:100%; height:min(17vh,140px); margin:6px 0 6px; background:#050505; border:1px solid var(--pl)}
.readout{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--pl)}
.readout div{padding:4px 6px 0; border-left:1px solid var(--pl); min-width:0}
.readout div:first-child{border-left:0; padding-left:0}
.readout span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.readout b{display:block; font:700 17px/1.1 var(--disp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tools{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:stretch}
.cpu{flex:1 1 130px; border:1.5px solid var(--paperFg); background:var(--paper); padding:3px 8px; display:flex; flex-direction:column; justify-content:center; min-width:130px}
.cpu span{font:600 11px/1.1 var(--mono); display:flex; justify-content:space-between; gap:6px; white-space:nowrap; text-transform:uppercase; letter-spacing:.05em}
.cpu span em{font-style:normal}
.cpu .m{height:6px; margin-top:4px; background:repeating-linear-gradient(90deg,var(--paperLine) 0 2px,transparent 2px 5px)}
.cpu .m i{display:block; height:100%; width:0; background:var(--cya); transition:width .2s}

/* buttons */
.seg{display:inline-flex; border:1.5px solid var(--pf,var(--paperFg)); background:var(--pb,var(--paper)); flex:none; max-width:100%; overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0; background:transparent; padding:7px 10px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; min-height:34px; color:var(--pf,var(--paperFg))}
.seg button+button{border-left:1.5px solid var(--pf,var(--paperFg))}
.seg button[aria-pressed="true"]{background:var(--pf,var(--paperFg)); color:var(--pb,var(--paper))}
.btn{border:1.5px solid var(--pf,var(--paperFg)); background:var(--pb,var(--paper)); color:var(--pf,var(--paperFg)); padding:7px 11px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; min-height:34px; white-space:nowrap}
.btn.fill{background:var(--pf,var(--paperFg)); color:var(--pb,var(--paper))}
.btn.acc{background:var(--pa); color:var(--pat); border-color:var(--pa)}
.btn[aria-pressed="true"]{background:var(--cya); color:#0B0B0B; border-color:var(--cya)}
.btn:disabled{opacity:.35; cursor:default}
.btn.sm{padding:4px 8px; min-height:28px; font-size:11px}
.top .btn,.top .seg{--pf:var(--paperFg); --pb:var(--paper)}

/* section header: spec-sheet block */
main{padding:4px 0 calc(176px + env(safe-area-inset-bottom,0px))}
section{margin-top:14px; scroll-margin-top:360px}
.sh{border-bottom:1.5px solid var(--pf); margin-bottom:12px; padding-bottom:8px}
.sh .meta{margin-bottom:6px}
.shm{display:flex; align-items:flex-end; gap:12px}
.num{font:800 52px/.82 var(--disp); letter-spacing:-.02em; flex:none}
.shm h2{margin:0; font:700 26px/1 var(--disp); text-transform:uppercase; letter-spacing:.02em; flex:1; min-width:0}
.shm .aside{display:flex; gap:6px; align-items:center; flex:none}
.sq{display:flex; gap:3px; margin-bottom:4px}
.sq i{width:9px; height:9px; border:1px solid var(--pf)}
.sq i.m{background:var(--mag)} .sq i.c{background:var(--cya)} .sq i.y{background:var(--yel)}
.onoff{display:inline-flex; border:1.5px solid var(--pf)}
.onoff button{border:0; background:transparent; color:var(--pf); font:700 11px/1 var(--mono); padding:6px 8px; min-height:30px; letter-spacing:.06em}
.onoff button[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.onoff button.on[aria-pressed="true"]{background:var(--pa); color:var(--pat)}
.off-body{opacity:.35; filter:grayscale(1); pointer-events:none}
.note{color:var(--pm); font-size:12px; margin:10px 0 0; max-width:64ch}
.lbl{font:500 10.5px/1.2 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.hz{height:12px; margin-top:14px; background:repeating-linear-gradient(-45deg,var(--pf) 0 6px,transparent 6px 12px); border:1.5px solid var(--pf)}
.bc{display:block; height:34px; width:100%; margin-top:12px}
.bcl{display:flex; justify-content:space-between; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.1em; margin-top:3px}

/* sliders: table rows */
.row{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:0 18px}
.sl{border-bottom:1px solid var(--pl); padding:8px 0 4px}
.sl label{display:flex; justify-content:space-between; align-items:baseline; font:500 11px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--pm)}
.sl label b{font:700 17px/1 var(--disp); color:var(--pf); letter-spacing:.01em; text-transform:none}
input[type=range]{-webkit-appearance:none; appearance:none; background:transparent; width:100%; height:26px; margin:0; --v:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px; background:linear-gradient(90deg,var(--pa) var(--v),var(--pl) var(--v))}
input[type=range]::-moz-range-track{height:4px; background:linear-gradient(90deg,var(--pa) var(--v),var(--pl) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:22px; background:var(--pb); border:2px solid var(--pf); margin-top:-9px; border-radius:0}
input[type=range]::-moz-range-thumb{width:9px; height:19px; background:var(--pb); border:2px solid var(--pf); border-radius:0}
.flash{animation:flash 1.3s ease-out}
.flash b{animation:flashT 1.3s ease-out}
@keyframes flash{0%{background:var(--yel); color:#101010}100%{background:transparent}}
@keyframes flashT{0%{color:#101010}}

/* library */
.search{width:100%; border:1.5px solid var(--pf); background:transparent; padding:8px 10px; margin:10px 0; font:500 13px var(--mono)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:6px; max-height:290px; overflow-y:auto; padding-right:2px}
.li{display:flex; border:1.5px solid var(--pf); min-height:42px; background:var(--pb)}
.li .add{flex:1; text-align:left; border:0; background:transparent; padding:6px 8px; font:600 12.5px/1.15 var(--mono); display:flex; align-items:center; gap:7px; min-width:0; color:var(--pf)}
.li .add span.t{overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; flex:1}
.li .play{border:0; border-left:1.5px solid var(--pf); background:transparent; width:36px; flex:none; font-size:11px; color:var(--pf)}
.li.on{background:var(--pa); border-color:var(--pa)}
.li.on .add,.li.on .play{color:var(--pat)}
.li.on .play{border-left-color:var(--pat)}
.cnt{flex:none; font:700 11px/1 var(--mono); padding:3px 5px; background:var(--pat); color:var(--pa); display:none}
.li.on .cnt{display:inline-block}
.bdg{flex:none; font:700 11px/1 var(--mono); width:18px; height:18px; display:grid; place-items:center; border:1.5px solid currentColor}
.li.on .bdg{border-color:var(--pat)}

/* mixer */
.mix{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity}
.ch{flex:0 0 128px; width:128px; border:1.5px solid var(--pf); background:var(--paper); color:var(--paperFg); scroll-snap-align:start; display:flex; flex-direction:column; --pb:var(--paper); --pf:var(--paperFg); --pl:var(--paperLine); --pm:var(--paperMute); --pa:var(--c); --pat:#fff}
.ch .hd{background:var(--c); color:#101010; padding:5px 6px; border-bottom:1.5px solid var(--paperFg); display:flex; align-items:center; gap:4px; min-height:34px}
.ch .hd .nm{font:700 15px/1 var(--disp); text-transform:uppercase; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch .hd .x{border:0; background:transparent; color:#101010; font-size:17px; width:24px; height:24px; padding:0}
.ch .hd .bdg{border-color:#101010}
.ch .idl{font:500 9.5px/1 var(--mono); color:var(--paperMute); padding:5px 6px 0; letter-spacing:.08em}
.ch .bd{padding:4px 7px 8px; display:flex; flex-direction:column; gap:2px}
.fad{display:flex; gap:8px; align-items:stretch; height:118px; justify-content:center; margin:4px 0 6px}
.vf{position:relative; width:34px; touch-action:none; cursor:ns-resize}
.vf::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--paperLine)}
.vf .fl{position:absolute; left:50%; bottom:0; width:4px; margin-left:-2px; background:var(--c)}
.vf .cap{position:absolute; left:3px; right:3px; height:14px; background:var(--paper); border:2px solid var(--paperFg); margin-bottom:-7px}
.vf .cap::after{content:""; position:absolute; left:3px; right:3px; top:4px; height:2px; background:var(--paperFg)}
.vf .tk{position:absolute; right:-4px; width:4px; height:1px; background:var(--paperMute)}
.vu{width:8px; border:1px solid var(--paperFg); display:flex; align-items:flex-end; background:repeating-linear-gradient(0deg,transparent 0 3px,var(--paperLine) 3px 4px)}
.vu i{display:block; width:100%; height:0; background:var(--c)}
.ms{display:flex; gap:4px; margin-bottom:2px}
.ms button{flex:1; border:1.5px solid var(--paperFg); background:transparent; font:700 12px/1 var(--mono); height:28px}
.ms button[aria-pressed="true"]{background:var(--paperFg); color:var(--paper)}
.ch .sl{padding:4px 0 0}
.ch .sl label{font-size:9.5px}
.ch .sl label b{font-size:14px}
.ch input[type=range]{height:22px}
.empty{border:1.5px dashed var(--pm); padding:18px; color:var(--pm); text-align:center; width:100%}

/* chips */
.wrap{display:flex; flex-wrap:wrap; gap:6px}
.chipbtn{border:1.5px solid var(--pf); background:transparent; color:var(--pf); padding:6px 9px; font:600 12px/1 var(--mono); min-height:34px; display:inline-flex; align-items:center; gap:6px; text-transform:uppercase}
.chipbtn[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.chipbtn svg{width:26px; height:14px}
canvas.env{width:100%; height:150px; display:block; border:1.5px solid var(--pf); margin-bottom:6px}

/* fx */
.fxi{border:1.5px solid var(--pf); margin-bottom:8px}
.fxi .hd{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid var(--pl)}
.fxi .hd b{font:700 17px/1 var(--disp); text-transform:uppercase; flex:1; min-width:0}
.fxi .hd .n{width:24px; height:24px; background:var(--c); border:1.5px solid var(--pf); color:#101010; font:700 12px/21px var(--mono); text-align:center; flex:none}
.fxi .bd{padding:2px 10px 8px}
.fxi.off .bd{opacity:.35}
select.btn{appearance:none; padding-right:28px; background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%); background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%; background-size:5px 5px; background-repeat:no-repeat}
select.btn option,select.btn optgroup{background:var(--paper); color:var(--paperFg)}
.sw{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--pl); font:600 12px var(--mono); text-transform:uppercase}
.sw input{width:18px; height:18px; accent-color:var(--pa)}

/* export / projects */
.field{width:100%; border:1.5px solid var(--pf); background:transparent; padding:9px 10px; font:600 15px var(--mono); color:var(--pf)}
.acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
details.code{margin-top:12px; border-top:1px solid var(--pl); padding-top:6px}
details.code summary{cursor:pointer; font:600 12px/1 var(--mono); padding:6px 0; text-transform:uppercase; letter-spacing:.06em}
pre{background:#050505; color:#DADAD5; font:12px/1.45 var(--mono); padding:10px; border:1px solid var(--pl); overflow:auto; max-height:320px; margin:8px 0 0}
.plist{margin-top:10px; border-top:1.5px solid var(--pf)}
.pi{display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--pl); padding:6px 0}
.pi .idx{font:700 18px/1 var(--disp); width:28px; flex:none; color:var(--pm)}
.pi .nmwrap{flex:1; min-width:0}
.pi input{width:100%; border:0; border-bottom:1px dashed var(--pl); background:transparent; font:600 14px var(--mono); padding:3px 0; color:var(--pf)}
.pi small{color:var(--pm); font-size:10px; display:block; letter-spacing:.05em}

/* keyboard */
.kb{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--ink); color:#ECEBE6; padding:0 0 env(safe-area-inset-bottom,0px); border-top:1.5px solid #ECEBE6; --pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.kb .in2{max-width:780px; margin:0 auto; padding:7px 10px 8px}
.kctl{display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; padding-bottom:7px}
.kctl::-webkit-scrollbar{display:none}
.kctl .oct{font:700 18px/1 var(--disp); min-width:30px; text-align:center}
.bpm{display:flex; align-items:center; gap:4px; font:600 11px/1 var(--mono); white-space:nowrap}
.keys{position:relative; height:76px; display:flex; touch-action:none; user-select:none; -webkit-user-select:none}
.wk{flex:1; border:1.5px solid #ECEBE6; border-right-width:0; background:#F0EFEA; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; font:600 10px/1 var(--mono); color:#555}
.wk:last-child{border-right-width:1.5px}
.bk{position:absolute; top:0; height:46px; background:#121314; border:1.5px solid #ECEBE6; border-top:0; z-index:2}
.wk.on{background:var(--cya); color:#0B0B0B}
.bk.on{background:var(--mag)}
.toast{position:fixed; left:50%; bottom:calc(186px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--paperFg); color:var(--paper); padding:9px 14px; font:600 12px/1.2 var(--mono); z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; text-transform:uppercase; letter-spacing:.04em}
.toast.show{opacity:1}
.menu{position:absolute; right:0; top:48px; z-index:40; width:min(300px,92vw)}
.menu[hidden]{display:none}
.menu .in{display:flex; flex-direction:column; gap:6px}
.menu select{width:100%}
.tip{font-size:11px; color:var(--paperMute); margin:6px 2px 0}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

.dim{opacity:.35}
.chipbtn.big{min-height:40px; padding:8px 14px; font-size:13px; letter-spacing:.06em}
.chipbtn.big[aria-pressed="true"]{background:var(--pa); color:var(--pat); border-color:var(--pa)}
.band{margin:22px 0 4px; padding:6px 10px; background:var(--pf); color:var(--pb); font:700 20px/1 var(--disp); text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between}
.band::after{content:""; width:60px; background:repeating-linear-gradient(-45deg,var(--pb) 0 5px,transparent 5px 10px)}
.outs{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin-top:10px}
.outc{border:1.5px solid var(--pf); padding:10px 10px 12px}
.outc .oh b{font:700 20px/1 var(--disp); text-transform:uppercase}
.glbl{grid-column:1/-1; font:500 10.5px/1 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.08em; padding:6px 0 2px}
.fxgrid{max-height:none}

</style>
</head>
<body>
<div class="app"><header id="top" class="top"></header><main id="main"></main></div>
<div id="kb" class="kb"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const n3=x=>(+x).toFixed(3).replace(/\.?0+$/,'')||'0';
const SRC=[
 // key, cat, label, badge, charKey, sc(F,p), cost
 ['testsine','norns','TestSine','=',null,(F)=>`SinOsc.ar(${F}) * 0.286`,0.2],
 ['pp_sq','norns','PolyPerc · cuadrada','≈','c_bright',null,0.7],
 ['pp_p25','norns','PolyPerc · pulso 25%','≈','c_bright',null,0.7],
 ['pp_p10','norns','PolyPerc · pulso 10%','≈','c_bright',null,0.7],
 ['pp_pluck','norns','PolyPerc · pluck','≈','c_bright',null,0.7],
 ['pp_bass','norns','PolyPerc · bajo','≈','c_bright',null,0.7],
 ['pp_pad','norns','PolyPerc · pad','≈','c_bright',null,0.7],
 ['pp_glass','norns','PolyPerc · vidrio','≈','c_bright',null,0.7],
 ['ppx_saw','norns','PolyPerc+ sierra','U',  'c_bright',null,0.7],

      h('button',{class:'btn sm',type:'button',onclick:()=>{ loadPatch(projs[n].patch); toast(n); }},t('open')),
      h('button',{class:'btn sm',type:'button',onclick:e=>{ if(delArm!==n){ delArm=n; e.currentTarget.textContent=t('sure'); return; } delete projs[n]; store.set('nsc.projects',projs); delArm=null; renderProjects(); }},t('del')))); });
  const file=h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); const p=j.patch||j; if(!validPatch(p)) throw 0; loadPatch(p); toast(t('imported')); }catch(_){ toast(t('badFile')); } e.target.value=''; }});
  el.append(h('div',{class:'in'},sh('projects','project'),
    h('div',{class:'lbl'},t('synthName')),nameField(),
    h('div',{class:'acts'},
      h('button',{class:'btn acc',type:'button',onclick:()=>{ const n=curName(); P.name=n; const pr=store.get('nsc.projects',{}); pr[n]={patch:JSON.parse(JSON.stringify(P)),t:Date.now()}; store.set('nsc.projects',pr); document.querySelectorAll('.namefield').forEach(f=>f.value=n); $('#pname').textContent=n; changed(); renderProjects(); toast(t('saved')+': '+n); }},t('save')),
      h('button',{class:'btn',type:'button',onclick:()=>{ const p=defPatch(); p.channels=[]; loadPatch(p); toast(t('newDone')); }},t('newP')),
      h('button',{class:'btn',type:'button',onclick:()=>saveFile(slug()+'.nsc.json',new Blob([JSON.stringify({app:'norns-sound-creator',v:2,patch:P},null,2)],{type:'application/json'}))},t('expJson')),
      h('button',{class:'btn',type:'button',onclick:()=>file.click()},t('impJson')),file),
    list,h('p',{class:'note'},t('renameHint')+' '+t('projNote'))));
}

// ---------- creativity ----------
function getPath(p,path){ const a=path.split('.'); if(a[0]==='ch'){ const c=p.channels.find(x=>x.id===a[1]); return c?c[a[2]]:undefined; } if(a[0]==='fx'){ const f=p.fx.find(x=>x.id===a[1]); return f?f.p[a[2]]:undefined; } let o=p; for(const k of a){ if(o==null) return undefined; o=o[k]; } return o; }
function flashChanges(old){ let n=0; document.querySelectorAll('#main [data-path]').forEach(e=>{ const a=getPath(old,e.dataset.path), b=getPath(P,e.dataset.path); if(a!==b){ e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); n++; } }); return n; }
function surprise(){
  ensureAudio();
  const osc=SRC.filter(r=>r[1]!=='noise').map(r=>r[0]), noi=SRC.filter(r=>r[1]==='noise').map(r=>r[0]);
  const n=1+Math.floor(Math.random()*3);
  P.channels=[]; for(let i=0;i<n;i++){ const src= Math.random()<0.75?pick(osc):pick(noi); P.channels.push({id:uid(),src,level:+rr(0.4,0.8).toFixed(2),pan:+rr(-0.5,0.5).toFixed(2),mute:false,solo:false,tune:i===0?0:pick([0,0,12,-12,7,5,19]),fine:Math.round(rr(-8,8)),p1:+Math.random().toFixed(2)}); }
  P.filter={on:true,type:pick(['RLPF','MoogFF','LPF','BPF','DFM1','MoogLadder','Resonz','RLPF','MoogFF']),cutoff:Math.round(300*Math.pow(2,rr(0,5))),res:+rr(0,0.8).toFixed(2)};
  P.env=Object.assign({on:true},pick([{a:0.005,d:rr(0.15,0.6),s:rr(0,0.2),r:rr(0.2,0.8)},{a:rr(0.3,2),d:1,s:rr(0.5,0.9),r:rr(1.5,4)},{a:0.01,d:rr(0.3,0.8),s:rr(0.3,0.7),r:rr(0.3,1)},{a:0.002,d:rr(0.05,0.2),s:0,r:rr(0.05,0.3)}]));
  P.lfo={on:true,shape:pick(['tri','sin','sq','rnd','shh','shs']),dest:pick(['cutoff','cutoff','pitch','amp','pan','res']),rate:+(0.1*Math.pow(80,Math.random())).toFixed(2),depth:+rr(0,0.5).toFixed(2)};
  if(P.lfo.dest==='pitch') P.lfo.depth=+rr(0,0.08).toFixed(3);
  const fxk=Object.keys(FX).filter(k=>k!=='limiter'&&k!=='compander'); P.fx=[]; P.fxOn=true; const nf=Math.floor(Math.random()*3);
  for(let i=0;i<nf;i++){ const k=pick(fxk); const p={}; for(const q in FX[k].p) p[q]=+rr(0.2,0.7).toFixed(2); P.fx.push({id:uid(),type:k,on:true,p}); }
  renderAll(); changed(); play({type:'on',note:12*(S.oct+1)}); setTimeout(()=>post({type:'off',note:12*(S.oct+1)}),500);
}
function mutate(){
  const old=JSON.parse(JSON.stringify(P));
  const j=(v,a,lo,hi)=>clamp(v+rr(-a,a),lo,hi);
  P.channels.forEach(c=>{ c.p1=+j(c.p1,0.18,0,1).toFixed(2); c.level=+j(c.level,0.12,0.05,1).toFixed(2); c.pan=+j(c.pan,0.15,-1,1).toFixed(2); if(Math.random()<0.3) c.fine=Math.round(j(c.fine,6,-50,50)); if(Math.random()<0.2){ const same=SRC.filter(r=>r[1]===SRCMAP[c.src].cat).map(r=>r[0]); c.src=pick(same); } });
  if(P.filter.on!==false){ P.filter.cutoff=Math.round(clamp(P.filter.cutoff*Math.pow(2,rr(-0.7,0.7)),40,16000)); P.filter.res=+j(P.filter.res,0.12,0,0.95).toFixed(2); }
  if(P.env.on!==false){ ['a','d','r'].forEach(k=>P.env[k]=+clamp(P.env[k]*Math.pow(2,rr(-0.6,0.6)),0.001,10).toFixed(3)); P.env.s=+j(P.env.s,0.12,0,1).toFixed(2); }
  if(P.lfo.on!==false){ P.lfo.rate=+clamp(P.lfo.rate*Math.pow(2,rr(-0.7,0.7)),0.05,30).toFixed(2); P.lfo.depth=+j(P.lfo.depth,0.1,0,1).toFixed(2); if(Math.random()<0.2) P.lfo.shape=pick(['tri','sin','sq','rnd','shh','shs']); }
  if(P.fxOn!==false) P.fx.forEach(f=>{ for(const k in f.p) f.p[k]=+j(f.p[k],0.12,0,1).toFixed(2); });
  renderAll(); changed(); flashChanges(old); toast(t('mutated'));
}

// ---------- keyboard ----------
let testOn=false, arpOn=false; const held=new Map();
function renderKb(){
  const el=$('#kb'); el.innerHTML='';
  const octL=h('span',{class:'oct'},'C'+S.oct);
  const bpmL=h('span',null,S.bpm);
  const setOct=d=>{ S.oct=clamp(S.oct+d,0,7); saveS(); octL.textContent='C'+S.oct; renderKeysLabels(); if(arpOn) post({type:'arp',on:true,bpm:S.bpm,root:12*(S.oct+1)}); };
  const testB=h('button',{class:'btn',type:'button','aria-pressed':String(testOn),onclick:async e=>{ testOn=!testOn; e.currentTarget.setAttribute('aria-pressed',testOn); await ensureAudio(); post({type:testOn?'on':'off',note:48,vel:0.9}); }},t('test'));
  const gateB=h('button',{class:'btn',type:'button','aria-pressed':'false'},t('gate'));
  gateB.addEventListener('pointerdown',async e=>{ e.preventDefault(); gateB.setAttribute('aria-pressed','true'); await ensureAudio(); post({type:'on',note:48,vel:0.9}); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>gateB.addEventListener(ev,()=>{ if(gateB.getAttribute('aria-pressed')==='true'){ gateB.setAttribute('aria-pressed','false'); post({type:'off',note:48}); } }));
  const arpB=h('button',{class:'btn',type:'button','aria-pressed':String(arpOn),onclick:async e=>{ arpOn=!arpOn; e.currentTarget.setAttribute('aria-pressed',arpOn); await ensureAudio(); post({type:'arp',on:arpOn,bpm:S.bpm,root:12*(S.oct+1)}); }},t('arp'));
  const bpm=d=>{ S.bpm=clamp(S.bpm+d,50,200); saveS(); bpmL.textContent=S.bpm; if(arpOn) post({type:'arp',on:true,bpm:S.bpm}); };
  const keys=h('div',{class:'keys',id:'keys'});
  const WH=[0,2,4,5,7,9,11,12], BL=[[1,1],[3,2],[6,4],[8,5],[10,6]];
  WH.forEach(s=>keys.append(h('div',{class:'wk','data-s':s},'')));
  BL.forEach(([s,pos])=>keys.append(h('div',{class:'bk','data-s':s,style:`left:calc(${pos}/8*100% - 5.5%);width:11%`})));
  const noteFor=s=>12*(S.oct+1)+s;
  keys.addEventListener('pointerdown',async e=>{ const k=e.target.closest('[data-s]'); if(!k) return; e.preventDefault(); await ensureAudio(); const n=noteFor(+k.dataset.s); held.set(e.pointerId,{n,k}); k.classList.add('on'); post({type:'on',note:n,vel:0.9}); });
  const up=e=>{ const v=held.get(e.pointerId); if(!v) return; held.delete(e.pointerId); v.k.classList.remove('on'); post({type:'off',note:v.n}); };
  keys.addEventListener('pointerup',up); keys.addEventListener('pointercancel',up); keys.addEventListener('pointerleave',up);
  el.append(h('div',{class:'in2'},h('div',{class:'kctl'},
    h('button',{class:'btn',type:'button','aria-label':'oct −',onclick:()=>setOct(-1)},'−'),octL,h('button',{class:'btn',type:'button','aria-label':'oct +',onclick:()=>setOct(1)},'+'),
    testB,gateB,arpB,h('span',{class:'bpm'},h('button',{class:'btn sm',type:'button','aria-label':'bpm −',onclick:()=>bpm(-5)},'−'),bpmL,' BPM',h('button',{class:'btn sm',type:'button','aria-label':'bpm +',onclick:()=>bpm(5)},'+'))),keys));
  renderKeysLabels();
}
function renderKeysLabels(){ document.querySelectorAll('.wk').forEach(k=>{ const s=+k.dataset.s; k.textContent= s===0?'C'+S.oct : s===12?'C'+(S.oct+1):''; }); }
const KMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12};
const kdown=new Set();
addEventListener('keydown',async e=>{ if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey) return; const k=e.key.toLowerCase(); if(k in KMAP&&!kdown.has(k)){ kdown.add(k); await ensureAudio(); const el=document.querySelector(`.keys [data-s="${KMAP[k]}"]`); el&&el.classList.add('on'); post({type:'on',note:12*(S.oct+1)+KMAP[k],vel:0.9}); } });
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(kdown.has(k)){ kdown.delete(k); const el=document.querySelector(`.keys [data-s="${KMAP[k]}"]`); el&&el.classList.remove('on'); post({type:'off',note:12*(S.oct+1)+KMAP[k]}); } });

// ---------- hi-res scope ----------
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let td=null, fd=null, roT=0;
function drawScope(ts){
  requestAnimationFrame(drawScope);
  const cv=$('#scope'); if(!cv) return; const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.fillStyle='#050505'; g.fillRect(0,0,W,H);
  const mode=S.scope;
  const areas= mode==='both'? [['osc',0,H/2],['spec',H/2,H/2]] : [[mode,0,H]];
  for(const [m,y0,hh] of areas){
    // grid
    g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; g.beginPath();
    for(let i=1;i<10;i++){ const x=Math.round(W*i/10)+.5; g.moveTo(x,y0); g.lineTo(x,y0+hh); }
    for(let i=1;i<(m==='osc'?8:4);i++){ const y=Math.round(y0+hh*i/(m==='osc'?8:4))+.5; g.moveTo(0,y); g.lineTo(W,y); } g.stroke();
    if(m==='osc'){ g.strokeStyle='rgba(255,255,255,.2)'; g.beginPath(); const cy=Math.round(y0+hh/2)+.5; g.moveTo(0,cy); g.lineTo(W,cy); g.stroke();
      g.beginPath(); for(let i=0;i<=50;i++){ const x=Math.round(W*i/50)+.5; g.moveTo(x,cy-(i%5?2:4)); g.lineTo(x,cy+(i%5?2:4)); } g.stroke(); }
    g.fillStyle='rgba(236,235,230,.55)'; g.font='500 9px "IBM Plex Mono", monospace'; g.fillText(m==='osc'?'CH1  TIME':'FFT  30 Hz – 16 kHz',6,y0+12);
    if(!analyser) continue;
    if(m==='osc'){ if(!td) td=new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(td);
      let s=0; for(let i=1;i<td.length/2;i++){ if(td[i-1]<0&&td[i]>=0){ s=i; break; } }
      const N=Math.min(1536,td.length-s-1), cy=y0+hh/2, amp=hh/2*0.9;
      g.save(); g.beginPath(); g.rect(0,y0,W,hh); g.clip();
      g.beginPath(); for(let x=0;x<=W;x++){ const idx=s+x/W*N, i0=Math.floor(idx), fr=idx-i0; const v=(td[i0]||0)*(1-fr)+(td[i0+1]||0)*fr; const y=cy-v*amp; if(x===0) g.moveTo(x,y); else g.lineTo(x,y); }
      g.strokeStyle='rgba(42,158,191,.35)'; g.lineWidth=5; g.stroke(); g.strokeStyle='#8FE3F7'; g.lineWidth=1.5; g.stroke(); g.restore();
    } else { if(!fd) fd=new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(fd);
      const ny=ac.sampleRate/2, bins=fd.length; g.beginPath(); g.moveTo(0,y0+hh);
      for(let x=0;x<=W;x+=1){ const f=30*Math.pow(16000/30,x/W); const i=Math.min(bins-1,Math.round(f/ny*bins)); const db=Math.max(-96,Math.min(-6,fd[i])); const v=(db+96)/90; g.lineTo(x,y0+hh-v*(hh-4)); }
      g.lineTo(W,y0+hh); g.closePath(); const gr=g.createLinearGradient(0,y0,0,y0+hh); gr.addColorStop(0,'rgba(209,47,125,.75)'); gr.addColorStop(1,'rgba(209,47,125,.05)'); g.fillStyle=gr; g.fill(); g.strokeStyle='#F07AB2'; g.lineWidth=1.2; g.stroke(); }
  }
  if(mode==='both'){ g.strokeStyle='rgba(255,255,255,.3)'; g.beginPath(); g.moveTo(0,Math.round(H/2)+.5); g.lineTo(W,Math.round(H/2)+.5); g.stroke(); }
  // corner brackets
  g.strokeStyle='rgba(236,235,230,.6)'; g.lineWidth=1.5; g.beginPath(); const c=10; [[1,1,1,1],[W-1,1,-1,1],[1,H-1,1,-1],[W-1,H-1,-1,-1]].forEach(([x,y,sx,sy])=>{ g.moveTo(x,y+sy*c); g.lineTo(x,y); g.lineTo(x+sx*c,y); }); g.stroke();
  if(ts-roT>120){ roT=ts; const n=$('#ro-n'), f=$('#ro-f'), p=$('#ro-p'), v=$('#ro-v'); if(n){ n.textContent= lastNote==null?'—':NAMES[lastNote%12]+(Math.floor(lastNote/12)-1); f.textContent= lastNote==null?'—':(440*Math.pow(2,(lastNote-69)/12)).toFixed(1); p.textContent= peakHold>0.0005? (20*Math.log10(peakHold)).toFixed(1)+' dB':'−∞'; v.textContent=pad2(lastVoices)+'/'+pad2(P.voices); }
    const sr=$('#sr'); if(sr&&ac) sr.textContent=(ac.sampleRate/1000).toFixed(1)+' kHz'; }
}

// ---------- boot ----------
function renderAll(){ renderTop(); renderLib(); renderMixer(); renderVoices(); renderEnv(); renderFilter(); renderLfo(); renderFx(); renderExport(); renderProjects(); renderKb(); }
function boot(){
  applyTheme();
  const main=$('#main');
  Object.keys(SECT).forEach(id=>main.append(h('section',{id,class:'panel '+SECT[id][1]})));
  renderAll(); requestAnimationFrame(drawScope);
  document.addEventListener('pointerdown',e=>{ const mm=$('#menu'); if(mm&&!mm.hidden&&!e.target.closest('#menu')&&!e.target.closest('.iconbtn')) mm.hidden=true; });
  addEventListener('resize',()=>drawEnv());
  if(document.fonts) document.fonts.ready.then(()=>drawEnv());
  (async()=>{ try{ if(window.claude&&window.claude.use){ dl=await window.claude.use('downloads'); } }catch(e){ dl=null; } })();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) post({type:'alloff'}); });
}
boot();
})();
